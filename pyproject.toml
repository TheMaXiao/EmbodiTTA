[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emboditta"
version = "0.1.0"
description = "On-demand test-time adaptation for resource-constrained visual systems"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "Pillow>=9.0",
    "timm>=1.0",
]

[tool.setuptools.packages.find]
include = ["emboditta*"]